name: ValaryRPG-Arena
version: '${version}'
main: com.valaryrpg.arena.ValaryArenaPlugin
api-version: '1.21'
description: '${description}'
authors:
  - ValaryRPG
website: https://github.com/Nyxon-com/ValaryRPGarena-instances
folia-supported: false
load: POSTWORLD
depend:
  - MythicMobs
softdepend:
  - ValaryRPG-Core
  - Vault
  - PlaceholderAPI
  - Multiverse-Core
  - TAB
commands:
  arena:
    description: Avvia o lascia un'arena istanziata
    usage: /<command>
  party:
    description: Party per le arene
    usage: /<command>
  dungeon:
    description: Avvia o lascia un dungeon istanziato
    usage: /<command>
permissions:
  valary.arena:
    description: Usa /arena
    default: true
  valary.arena.start:
    description: /arena start
    default: true
  valary.arena.list:
    description: /arena list
    default: true
  valary.arena.leave:
    description: /arena leave
    default: true
  valary.arena.stats:
    description: /arena stats
    default: true
  valary.arena.milestones:
    description: /arena milestones
    default: true
  valary.arena.stats.other:
    description: Vedi kill e milestone di altri player
    default: op
  valary.arena.reload:
    description: /arena reload
    default: op
  valary.arena.cooldown.bypass:
    description: Ignora i cooldown di ingresso arena
    default: op
  valary.arena.command.bypass:
    description: Usa comandi bloccati dentro arena o dungeon
    default: op
  valary.dungeon:
    description: Usa /dungeon
    default: true
  valary.dungeon.start:
    description: /dungeon start
    default: true
  valary.dungeon.start.other:
    description: /dungeon start <id> <player> (console o staff)
    default: op
  valary.dungeon.list:
    description: /dungeon list
    default: true
  valary.dungeon.leave:
    description: /dungeon leave
    default: true
  valary.dungeon.spawn:
    description: /dungeon spawn
    default: true
  valary.party:
    description: Usa /party
    default: true
  valary.party.create:
    description: /party create
    default: true
  valary.party.invite:
    description: /party invite
    default: true
  valary.party.accept:
    description: /party accept
    default: true
  valary.party.leave:
    description: /party leave
    default: true
  valary.party.kick:
    description: /party kick
    default: true
  valary.party.disband:
    description: /party disband
    default: true
