# =============================================================================
# ValaryRPG-Arena — comandi, permessi, delay. Testi in lang/messages.yml.
# =============================================================================

commands:
  arena: arena
  arena-aliases: []
  party: party
  party-aliases: []
  arena-start: start
  arena-list: list
  arena-leave: leave
  arena-stats: stats
  arena-milestones: milestones
  arena-reload: reload
  dungeon: dungeon
  dungeon-aliases: []
  dungeon-start: start
  dungeon-list: list
  dungeon-leave: leave
  party-create: create
  party-invite: invite
  party-accept: accept
  party-leave: leave
  party-kick: kick
  party-disband: disband

permissions:
  arena: valary.arena
  arena-start: valary.arena.start
  arena-list: valary.arena.list
  arena-leave: valary.arena.leave
  arena-stats: valary.arena.stats
  arena-milestones: valary.arena.milestones
  arena-stats-other: valary.arena.stats.other
  arena-reload: valary.arena.reload
  arena-cooldown-bypass: valary.arena.cooldown.bypass
  dungeon: valary.dungeon
  dungeon-start: valary.dungeon.start
  dungeon-list: valary.dungeon.list
  dungeon-leave: valary.dungeon.leave
  party: valary.party
  party-create: valary.party.create
  party-invite: valary.party.invite
  party-accept: valary.party.accept
  party-leave: valary.party.leave
  party-kick: valary.party.kick
  party-disband: valary.party.disband

delays:
  command-cooldown-millis: 250

# 8 GB RAM: tetto arene+dungeon insieme. 0 = nessun tetto extra (solo per-boss/dungeon).
# Heap Java consigliato: -Xmx5G. Copy una alla volta per non piccare la RAM.
instances:
  max-loaded: 16
  copy-max-concurrent: 1
  world:
    keep-spawn-in-memory: false
    view-distance: 4
    simulation-distance: 2
    random-tick-speed: 0
    vanilla-mob-spawning: false
