# =============================================================================
# Brand e testi MiniMessage. Java non hardcoda colori/prefix/separator.
# Placeholder: {prefix} {separator} {player} {target} {boss} {slot} {world}
# {kills} {threshold} {mob} {size} {max} {position} {seconds} {leader}
# {warmup} {boss-kills} {max-bosses} {top-damager} {top-damage}
# =============================================================================

brand:
