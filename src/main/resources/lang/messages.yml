  prefix: "<gradient:#5F22C3:#40099B><bold>ValaryRPG</bold></gradient> <dark_gray>»</dark_gray> "
  separator: "<bold><strikethrough><gradient:#5F22C3:#40099B>                                                          </gradient></strikethrough></bold>"

errors:
