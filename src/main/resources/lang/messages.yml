    - "{separator}"
    - "{prefix}<gray>/arena start <white>boss</white>"
    - "{prefix}<gray>/arena list"
    - "{prefix}<gray>/arena leave"
    - "{prefix}<gray>/arena stats <white>[player] [boss]</white>"
    - "{prefix}<gray>/arena milestones <white>[player]</white>"
    - "{separator}"
  list-header: "{prefix}<gray>Arene attive:"
  list-entry: "{prefix}{display} <dark_gray>—</dark_gray> <gray>mondo <white>{world}</white>, slot <white>{slot}</white>, giocatori <white>{players}</white>"
  list-footer: "{separator}"
  list-empty: "{prefix}<gray>Non ci sono arene attive."
  started: "{prefix}<gray>Arena <white>{boss}</white> avviata. Slot <white>{slot}</white>."
  queued: "{prefix}<gray>Tutte le istanze di <white>{boss}</white> sono occupate. Coda: <white>#{position}</white>."
  queue-removed: "{prefix}<gray>Il party è uscito dalla coda di <white>{boss}</white>."
  leave: "{prefix}<gray>Hai lasciato l'arena."
  eliminated: "{prefix}<gray>Sei stato eliminato dall'arena."
  member-left: "{prefix}<gray><white>{player}</white> ha lasciato l'arena."
  timeout: "{prefix}<gray>Tempo scaduto. Uscita dall'arena."
  empty-unload: "{prefix}<gray>Nessun giocatore rimasto. Arena chiusa."
  reloaded: "{prefix}<gray>Configurazione ricaricata."
  reload-failed: "{prefix}<gray>Reload fallito. Controlla la console."
  stats-header: "{prefix}<gray>Kill di <white>{player}</white>:"
  stats-entry: "{prefix}<gray>{mob}: <white>{kills}</white>"
  stats-mob: "{prefix}<gray>{player} — {mob}: <white>{kills}</white> kill"
  stats-empty: "{prefix}<gray>{player} non ha kill registrati."
  stats-footer: "{separator}"
  boss-cap: "{prefix}<gray>Cap boss raggiunto (<white>{kills}</white>/<white>{max}</white>). Uscita dall'arena."

hologram:
  unlimited: "∞"
  none: "—"
  warmup-combat: "<gray>in combattimento"
  warmup-wait: "<white>{seconds}s</white>"
  warmup-ready: "<gray>in spawn"
  warmup-done: "<gray>completata"
  lines:
    - "<gradient:#5F22C3:#40099B><bold>{boss}</bold></gradient>"
    - "<gray>Warmup <dark_gray>•</dark_gray> {warmup}"
    - "<gray>Boss <white>{boss-kills}</white><dark_gray>/</dark_gray><white>{max-bosses}</white>"
    - "<gray>Top danno <dark_gray>•</dark_gray> <white>{top-damager}</white>"
    - "<dark_gray>{top-damage}</dark_gray>"

party:
  help:
    - "{separator}"
    - "{prefix}<gray>/party create"
    - "{prefix}<gray>/party invite <white>player</white>"
    - "{prefix}<gray>/party accept"
    - "{prefix}<gray>/party leave"
    - "{prefix}<gray>/party kick <white>player</white>"
    - "{prefix}<gray>/party disband"
    - "{separator}"
  usage-invite: "{prefix}<gray>Uso: <white>/party invite player</white>"
  usage-kick: "{prefix}<gray>Uso: <white>/party kick player</white>"
  created: "{prefix}<gray>Party creato. Sei il leader."
  disbanded: "{prefix}<gray>Il party è stato sciolto."
  invited: "{prefix}<gray>Invito inviato a <white>{target}</white>."
  invite-received: "{prefix}<gray><white>{player}</white> ti ha invitato. <white>/party accept</white>"
  invite-expired: "{prefix}<gray>L'invito è scaduto."
  accepted: "{prefix}<gray>Sei entrato nel party di <white>{leader}</white>."
  member-joined: "{prefix}<gray><white>{player}</white> è entrato nel party."
  left: "{prefix}<gray>Hai lasciato il party."
  member-left: "{prefix}<gray><white>{player}</white> ha lasciato il party."
  kicked: "{prefix}<gray>Sei stato espulso dal party."
  member-kicked: "{prefix}<gray><white>{target}</white> è stato espulso."
  leader-passed: "{prefix}<gray><white>{player}</white> è il nuovo leader."

milestone:
  reached: "{prefix}<gray>Milestone <white>{threshold}</white> su <white>{mob}</white> (<white>{kills}</white> kill)."
  stats-header: "{prefix}<gray>Milestone di <white>{player}</white>:"
  stats-entry: "{prefix}<gray>{mob}: <white>{kills}</white> kill, prossimo <white>{next}</white>"
  stats-entry-done: "{prefix}<gray>{mob}: <white>{kills}</white> kill, tutte le soglie sbloccate."
  stats-none: "{prefix}<gray>Nessuna milestone configurata."
  stats-footer: "{separator}"
