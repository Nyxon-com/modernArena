# =============================================================================
# Milestone boss (kill personali).
# Placeholder: {player} {uuid} {name} {mob} {kills} {threshold}
#
# claim-revision: incrementa quando cambi le reward. Azzera i claim e al join
# (o reload) ridà le ricompense a chi ha gia' raggiunto le soglie.
#
# Scaling espansioni (template):
#   5   -> accesso / 1 key assicurata
#   20  -> 2 key OPPURE 1 gemma random del boss
#   50  -> 3 key / artefatti
#   75  -> 5 key / drop raro assicurato  (opzionale)
#   100 -> punti levelling
# =============================================================================

