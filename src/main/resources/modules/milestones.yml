# =============================================================================
# Soglie per player, chiave = internal name Mythic o id boss in arenas.yml.
# Ogni kill del player incrementa il suo contatore; la reward scatta sulla soglia personale.
# Placeholder: {player} {uuid} {name} {mob} {kills} {threshold}
# =============================================================================

mobs:
  ExampleBoss:
    10:
      message: "{prefix}<gray>Milestone <white>{threshold}</white> su <white>{mob}</white>."
      sound: milestone
      commands:
        - "[console] kit starter {player}"
    50:
      message: "{prefix}<gray>Milestone <white>{threshold}</white> su <white>{mob}</white>."
      sound: milestone
      commands:
        - "[console] eco give {player} 1000"
