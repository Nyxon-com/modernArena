# =============================================================================
# Boss, template, spawners, slot, coda, uscita.
# Mondi istanza: world-name-format (default arena_<boss>_<slot>).
# Core: worlds.ignore-prefixes deve includere il prefisso (arena_).
# Multiverse: non auto-importare i mondi arena_*.
# =============================================================================

settings:
  # Sottocartella dentro plugins/ValaryRPG-Arena/ che contiene le istanze temporanee.
  instances-directory: instances
  world-prefix: arena_
  world-name-format: "arena_{boss}_{slot}"
  spawner-name-format: "arena_{boss}_{slot}_{spawner}"
  max-instances-per-boss: 4
  # 0 = nessun cap globale oltre al per-boss
  max-instances-global: 0
  copy-exclude:
    - uid.dat
    - session.lock
  # 0 = nessun cap. Override per boss: bosses.<id>.max-bosses
  max-bosses: 0
  # Secondi dopo l'uscita prima di rientrare nella stessa arena. 0 = disattivo.
  entry-cooldown-seconds: 30
  # Secondi dopo l'uscita prima di entrare in un'altra arena. 0 = disattivo.
  between-cooldown-seconds: 60
  hologram:
    enabled: true
    update-ticks: 20
    # Usato se il boss non ha hologram.x/y/z: spawn + offset-y
    offset-y: 2.5

leave:
  # Comando eseguito dal player, senza slash. Vuoto = teleport a location.
  command: spawn
  location:
    world: world
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

queue:
  max-size: 20

bosses:
  example:
    display-name: "<gradient:#5F22C3:#40099B>Esempio</gradient>"
    template: arena_template_example
    permission: ""
    max-party-size: 4
    # 0 = nessun timer di durata
    duration-seconds: 0
    # 0 = eredita settings.max-bosses (0 globale = illimitato)
    max-bosses: 3
    hologram:
      enabled: true
      x: 0.5
      y: 66.5
      z: 0.5
      yaw: 0.0
      pitch: 0.0
    spawn:
      x: 0.5
      y: 64.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
    spawners:
      boss:
        # Clona tutte le opzioni di questo spawner Mythic; cambia solo nome, mondo e coordinate.
        source-spawner: ExampleSpawner
        # Internal name Mythic: serve per kill/milestone anche con source-spawner.
        mob: ExampleBoss
        x: 8.5
        y: 64.0
        z: 8.5
        yaw: 0.0
        pitch: 0.0
        cooldown-seconds: 30
        max-mobs: 1
        spawn-radius: 0
