# =============================================================================
# Dungeon istanziati: template → dungeon_<id>_<slot> → stanze sequentiali.
# Core: worlds.ignore-prefixes deve includere dungeon_ (oltre ad arena_).
# =============================================================================

settings:
  instances-directory: instances
  world-prefix: dungeon_
  world-name-format: "dungeon_{dungeon}_{slot}"
  spawner-name-format: "dungeon_{dungeon}_{slot}_{room}_{spawner}"
  max-instances-per-dungeon: 4
  # 0 = nessun cap globale oltre al per-dungeon. In produzione metti un numero (RAM/TPS).
  max-instances-global: 0
  copy-exclude:
    - uid.dat
    - session.lock
  complete-leave-ticks: 40
  entry-cooldown-seconds: 30
  between-cooldown-seconds: 60
  hologram:
    enabled: true
    update-ticks: 40
    offset-y: 2.5
    follow-door: true
    fly-ticks: 18
    spawn-forward: 2.5
  proximity-check-ticks: 10
  spawn-safe-radius: 6
  # Non si applica ai pack trigger: wave (i xyz restano). Solo immediate/radius in stanza 1 se il punto è fuori dal raggio.
  # delay-seconds: attesa tra ondate (orologio server). require-clear: aspetta che l'onda sia morta.
  # highlight-last: glow sull'ultimo minion. Title/subtitle/actionbar: lang dungeon.wave-title / wave-subtitle / wave.
  waves:
    delay-seconds: 3
    require-clear: true
    highlight-last: true
    announce-fade-in-ticks: 10
    announce-stay-ticks: 40
    announce-fade-out-ticks: 10
  leash:
    radius: 24
    heal: true
  wall:
    open-block: air
    close-block: iron_bars
    open-on: clear
    close-on: pass
    close-delay-ticks: 0
    pass-margin: 0.4
    physics: false
    close-faces: []

leave:
  command: spawn
  location:
    world: world
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

queue:
  max-size: 20

dungeons:
  example:
    display-name: "<gradient:#5F22C3:#40099B>Esempio</gradient>"
    template: dungeon_template_example
    permission: ""
    max-party-size: 4
    duration-seconds: 0
    hologram:
      enabled: true
      follow-door: true
      fly-ticks: 18
      spawn-forward: 2.5
    rooms:
      room1:
        objective: clear-mobs
        start-on: radius
        start-radius: 12
        spawn:
          x: 0.5
          y: 64.0
          z: 0.5
          yaw: 0.0
          pitch: 0.0
        intro:
          title: "<gradient:#5F22C3:#40099B><bold>Stanza 1</bold></gradient>"
          subtitle: "<gray>Elimina tutti i mob"
          actionbar: "<gray>10 nemici"
          fade-in-ticks: 10
          stay-ticks: 40
          fade-out-ticks: 10
        wall:
          from:
            x: 8
            y: 64
            z: 4
          to:
            x: 8
            y: 66
            z: 6
          open-block: air
          close-block: iron_bars
          open-on: clear
          close-on: pass
          close-delay-ticks: 0
          pass-margin: 0.4
          physics: false
        mobs:
          gate:
            trigger: wave
            mob: ExampleMob
            scatter: 2
            level: 1
            x: 4.5
            y: 64.0
            z: 4.5
            yaw: 0.0
            pitch: 0.0
            leash: 24
          left:
            trigger: wave
            mob: ExampleMob
            scatter: 2
            level: 1
            x: -4.5
            y: 64.0
            z: 4.5
            yaw: 180.0
            pitch: 0.0
            leash: 24
        # Ogni "-" è un'ondata. Chiavi = id in mobs (solo trigger: wave). Valore = quanti spawnano da quel punto.
        waves:
          - gate: 3
            left: 2
          - gate: 4
            left: 1
        outro:
          title: "<gradient:#5F22C3:#40099B><bold>Stanza pulita</bold></gradient>"
          subtitle: "<gray>Il passaggio si apre"
          actionbar: ""
          fade-in-ticks: 10
          stay-ticks: 40
          fade-out-ticks: 10
        commands:
          - "[console] kit starter {player}"
      boss:
        objective: boss
        intro:
          title: "<red><bold>Boss</bold></red>"
          subtitle: "<gray>Sconfiggi il guardiano"
          actionbar: ""
          fade-in-ticks: 10
          stay-ticks: 40
          fade-out-ticks: 10
        mobs:
          boss:
            mob: ExampleBoss
            trigger: radius
            radius: 12
            amount: 1
            times: 1
            scatter: 0
            level: 1
            x: 20.5
            y: 64.0
            z: 20.5
            yaw: 0.0
            pitch: 0.0
            leash:
              radius: 32
              heal: true
        outro:
          title: "<red><bold>Vittoria</bold></red>"
          subtitle: "<gray>Il dungeon è completo"
          actionbar: ""
          fade-in-ticks: 10
          stay-ticks: 40
          fade-out-ticks: 10
        commands:
          - "[console] kit starter {player}"
